name: Anti-Totem-Bypass
version: 3.1.0
main: de.example.maceguard.MaceGuard
api-version: '1.21'
description: Prevents multiple Totem pops in the same server tick.
author: EinfachAegis

commands:
  totembypass:
    description: Allows the Totem bypass mechanic.
    usage: /totembypass
    permission: antitotembypass.admin

  antitotembypass:
    description: Enables Anti-Totem-Bypass protection.
    usage: /antitotembypass
    permission: antitotembypass.admin

permissions:
  antitotembypass.admin:
    description: Allows enabling and disabling Anti-Totem-Bypass.
    default: op
